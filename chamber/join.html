<body>

        <img src="images/logo.svg" alt="Logo" width="80" height="80">

            <li><a href="discover.html">Discover</a></li>
        </ul>
    </nav>
    <main class="join-page">
        <h1>Join</h1>
        <form method="get" action="thankyou.html">
            <fieldset>
                <label for="fname">
                    First Name<span class="required">*</span><input type="text" id="fname" name="fname" title="First Name" required autocomplete="given-name">
                </label>

                <label for="lname">
                    Last Name<span class="required">*</span><input type="text" id="lname" name="lname" title="Last Name" required autocomplete="family-name">
                </label>

                <label for="title">
                    Organization Title<span class="required">*</span><input type="text" pattern="[A-Za-z\x20\x2D]{1,7}" id="title" name="title" title="Organization Title" required autocomplete="organization-title">
                </label>

                <label for="email">
                    Email Address<span class="required">*</span><input type="email" id="email" name="email" title="Email" required autocomplete="email" placeholder="email@email.com">
                </label>

                <label for="phone">
                    Phone Number<span class="required">*</span><input type="tel" id="phone" name="phone" title="Phone" required autocomplete="tel-national" placeholder="1234567890">
                </label>

                <label for="company">
                    Organization Name<span class="required">*</span><input type="text" id="company" name="company" title="Organization Name" required autocomplete="organization">
                </label>

                <label for="membership">Membership Level<span class="required">*</span>
                    <select id="membership" name="membership" title="Membership Level" required>
                        <option value="" disabled selected>Select a Membership ...</option>
                        <option value="np">NP Membership</option>
                        <option value="bronze">Bronze Membership</option>
                        <option value="silver">Silver Membership</option>
                        <option value="gold">Gold Membership</option>
                    </select>
                </label>

                <label for="description">
                    Organization Description<span class="required">*</span><textarea id="description" name="description" title="Description" required></textarea>
                </label>

                <input type="hidden" id="timestamp" name="timestamp" title="Timestamp">

                <input type="submit" value="Apply for Membership">
            </fieldset>
        </form>
        <div id="memberships" class="memberships"></div>
        <dialog id="membership-details">Learn More</dialog>
    </main>
    <footer>
