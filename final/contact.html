<body>
    <header>
        <img src="images/logo.svg" alt="Site Logo">
        <span>Trees of Utah</span>
        <button id="menu-button" class="menu" aria-label="Menu"></button>

    <nav id="nav-bar" class="navigation">

    </nav>
    <main>
        <h1>Contact</h1>
        <section>
            <h2 id="last-question"></h2>
        </section>
        <section>
            <form method="get" action="review.html">
                <fieldset>
                    <legend>Contact Info</legend>
                    <label for="fname">
                        First Name<input type="text" id="fname" name="fname">
                    </label>
                    <label for="lname">
                        Last Name<input type="text" id="lname" name="lname">
                    </label>
                    <label for="email">
                        Email<span class="required">*</span><input type="email" id="email" name="email" required>
                    </label>
                    <label for="phone">
                        Phone<input type="tel" id="phone" name="phone">
                    </label>
                </fieldset>
                <fieldset>
                    <legend>Form</legend>
                    <label for="question">
                        Question<span class="required">*</span><textarea id="question" name="question" required></textarea>
                    </label>
                </fieldset>
                <input type="submit" value="Ask Your Question">
            </form>
        </section>
    </main>
    <footer>
